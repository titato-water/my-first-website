* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: #000; color: #fff;
  font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card { max-width: 480px; width: 100%; text-align: center; }
.avatar {
  width: 84px; height: 84px; margin: 0 auto 24px; border-radius: 50%;
  background: linear-gradient(135deg, #6b6bff, #ff6bcb);
  display: flex; align-items: center; justify-content: center; font-size: 36px;
}
.tag {
  color: rgba(255,255,255,0.5); letter-spacing: 0.5px; font-size: clamp(12px,3vw,14px);
  text-transform: uppercase; margin: 0 0 12px;
}
h1 {
  font-size: clamp(26px, 6vw, 40px); font-weight: 700; margin: 0 0 16px; line-height: 1.3;
}
p.desc {
  color: rgba(255,255,255,0.6); line-height: 1.7; font-size: clamp(14px,3vw,16px);
  margin: 0 0 36px;
}
.buttons { display: flex; flex-direction: column; gap: 12px; }
a.btn {
  display: block; padding: 14px 24px; border-radius: 12px; text-decoration: none;
  font-weight: 700; font-size: clamp(14px,3vw,16px); transition: all .2s ease; border: 1px solid transparent;
}
a.primary { background: #fff; color: #000; }
a.primary:hover { background: rgba(255,255,255,0.85); }
a.outline { color: #fff; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); }
a.outline:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.7); }
.contact { display: flex; justify-content: center; gap: 14px; margin-top: 28px; }
.contact a {
  width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.06);
  transition: all .2s ease;
}
.contact a:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.7); }
.contact svg { width: 18px; height: 18px; fill: #fff; }
.foot { margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 12px; }
